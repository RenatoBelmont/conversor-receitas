    el.onclick = function(){ var id = el.getAttribute('data-check'); state.checklist[id] = !state.checklist[id]; refreshScale(); };
  });
  $all('#factorLine [data-act]').forEach(function(el){ el.onclick = function(ev){ acao(el.getAttribute('data-act'), el, ev); }; });
}
/* Sobe na árvore até achar a parte/ingrediente/passo do elemento (sem depender de Element.closest) */
function acima(el, attr){ while (el && el.getAttribute){ if (el.hasAttribute(attr)) return el; el = el.parentNode; } return null; }
function parteDe(el){ var w = acima(el, 'data-part'); return w ? acharParte(w.getAttribute('data-part')) : state.form.partes[0]; }
function bindForm(){
  var f = state.form;
  $all('[data-f]').forEach(function(el){
    el.oninput = function(){ f[el.getAttribute('data-f')] = el.value; f.dirty = true; el.className = el.className.replace(' invalid', ''); };
  });
  bindTopicCombo();
  $all('[data-pname]').forEach(function(el){
    el.oninput = function(){ parteDe(el).nome = el.value; f.dirty = true; el.className = el.className.replace(' invalid', ''); };
  });
  $all('[data-ing]').forEach(function(row){
    var id = row.getAttribute('data-ing'), parte = parteDe(row);
    var ing = parte.ingredientes.filter(function(i){ return i.id === id; })[0];
    Array.prototype.slice.call(row.querySelectorAll('[data-i]')).forEach(function(el){
      var campo = el.getAttribute('data-i');
      if (campo === 'contavel'){
        el.onchange = function(){
          ing.contavel = el.checked; f.dirty = true;
          if (ing.contavel && !ing.pesoUnitario){ var s = sugerirPeso(ing.nome); if (s) ing.pesoUnitario = String(s); }
          render();
        };
      } else if (campo === 'unidade'){
        el.onchange = function(){ ing.unidade = el.value; if (ing.unidade === 'a gosto'){ ing.contavel = false; ing.qtd = ''; } f.dirty = true; render(); };
      } else {
        el.oninput = function(){
          ing[campo] = el.value; f.dirty = true; el.className = el.className.replace(' invalid', '');
          if (campo === 'nome' && ing.contavel && !ing.pesoUnitario){
            var s = sugerirPeso(el.value);
            if (s){ ing.pesoUnitario = String(s); var pw = row.querySelector('[data-i="pesoUnitario"]'); if (pw) pw.value = s; }
          }
        };
      }
    });
  });
  $all('[data-stepid]').forEach(function(row){
    var parte = parteDe(row), id = row.getAttribute('data-stepid');
    var st = parte.passos.filter(function(s){ return s.id === id; })[0];
    row.querySelector('[data-step]').oninput = function(){ st.texto = this.value; f.dirty = true; };
  });
  /* Mover ingrediente/passo para outra parte */
  $all('[data-move]').forEach(function(sel){
    sel.onchange = function(){
      var tipo = sel.getAttribute('data-move'), de = parteDe(sel), para = acharParte(sel.value);
      if (!para || para === de) return;
      var lista = tipo === 'ing' ? 'ingredientes' : 'passos';
      var linha = acima(sel, tipo === 'ing' ? 'data-ing' : 'data-stepid');
      var id = linha.getAttribute(tipo === 'ing' ? 'data-ing' : 'data-stepid');
      var item = de[lista].filter(function(x){ return x.id === id; })[0];
      de[lista] = de[lista].filter(function(x){ return x.id !== id; });
      /* tira a linha vazia padrão da parte de destino, se houver */
      para[lista] = para[lista].filter(function(x){ return tipo === 'ing' ? (x.nome.trim() || x.qtd) : x.texto.trim(); });
      para[lista].push(item);
      if (!de[lista].length) de[lista].push(tipo === 'ing' ? novoIngForm() : novoPassoForm());
      f.dirty = true; render();
      toast((tipo === 'ing' ? 'Ingrediente' : 'Passo') + ' movido para ' + nomeParte(para, f.partes.indexOf(para)));
    };
  });
  var pi = document.getElementById('photoInput');
  if (pi) pi.onchange = function(){
    var file = pi.files && pi.files[0]; if (!file) return;
    comprimirImagem(file, function(url){
      if (!url){ toast('Não foi possível ler essa imagem.', 'err'); return; }
      f.foto = url; f.dirty = true; render();
    });
  };
}
function bindTopicCombo(){
  var input = document.getElementById('fTopico'), btn = document.getElementById('topicBtn'), menu = document.getElementById('topicMenu');
  if (!input) return;
  var todos = topicos();
  function abrir(filtrar){
    var q = filtrar ? norm(input.value).trim() : '';
    var lista = todos.filter(function(t){ return !q || norm(t[0]).indexOf(q) >= 0; });
    if (filtrar && (!lista.length || (lista.length === 1 && norm(lista[0][0]) === q))){ fechar(); return; }
    menu.innerHTML = lista.length
      ? lista.map(function(t, i){
          var sel = norm(t[0]) === norm(input.value).trim();
          return '<button type="button" class="combo-item' + (sel ? ' sel' : '') + '" role="option" data-ti="' + todos.indexOf(t) + '">' +
            '<span class="topic-dot" style="background:' + topicColor(t[0]) + '"></span>' + esc(t[0]) +
            '<span class="c-count">' + t[1] + '</span></button>';
        }).join('')
      : '<div class="combo-empty">Nenhum tópico ainda. Digite o nome de um novo.</div>';
    menu.className = 'combo-menu'; btn.className = 'combo-btn open'; btn.setAttribute('aria-expanded', 'true');
    Array.prototype.slice.call(menu.querySelectorAll('[data-ti]')).forEach(function(it){
      /* mousedown/touch não tiram o foco do campo antes do clique */
      it.onmousedown = function(e){ e.preventDefault(); };
      it.onclick = function(){
        input.value = todos[parseInt(it.getAttribute('data-ti'), 10)][0];
        state.form.topico = input.value; state.form.dirty = true; fechar();
      };
    });
  }
  function fechar(){ menu.className = 'combo-menu hidden'; btn.className = 'combo-btn'; btn.setAttribute('aria-expanded', 'false'); }
  btn.onmousedown = function(e){ e.preventDefault(); };
  btn.onclick = function(){ if (menu.className.indexOf('hidden') >= 0){ input.blur(); abrir(false); } else fechar(); };
  var base = input.oninput;
  input.oninput = function(){ if (base) base.call(input); abrir(true); };
  input.onkeydown = function(e){ if (e.key === 'Escape') fechar(); };
  document.onclick = function(e){ if (e.target !== btn && !menu.contains(e.target) && e.target !== input && !btn.contains(e.target)) fechar(); };
}
function focarUltimo(container, sel){
  var els = container ? container.querySelectorAll(sel) : [];
  if (els.length) els[els.length - 1].focus();
}
function containerDaParte(parte){
  return state.form.partes.length > 1 ? document.querySelector('#app [data-part="' + parte.id + '"]') : document.getElementById('app');
}
function parteTemConteudo(p){
  return p.ingredientes.some(function(i){ return i.nome.trim(); }) || p.passos.some(function(s){ return s.texto.trim(); });
}
function acao(act, el){
  var r = getRecipe(state.recipeId), f = state.form;
  switch (act){
    case 'home': go('home'); break;
    case 'new': abrirFormulario(null); break;
    case 'back-topic': voltarNivel(); break;
    case 'edit': abrirFormulario(state.recipeId); break;
    case 'clone':
      abrirFormulario(state.recipeId, true);
      setTimeout(function(){ var n = document.getElementById('fNome'); if (n){ n.focus(); try { n.select(); } catch(e){} } }, 0);
      break;
    case 'cancel-clone': go('detail', { recipeId: state.recipeId }, false); break;
    case 'share': if (r) menuExportar(r); break;
    case 'drive-save': driveExecutar('save'); break;
    case 'drive-restore': driveExecutar('restore'); break;
    case 'drive-logout': driveSair(); break;
    case 'delete':
      if (!r) break;
      confirmModal({ title: 'Excluir receita?', text: '"' + r.nome + '" será apagada deste aparelho. Isso não pode ser desfeito.', ok: 'Excluir', danger: true }, function(){
        var antes = JSON.stringify(state.recipes);
        state.recipes = state.recipes.filter(function(x){ return x.id !== r.id; });
        if (!saveData()){ state.recipes = JSON.parse(antes); return; }
        toast('Receita excluída'); go('home', { recipeId: null }, true);
      });
      break;
    case 'reset-scale': state.scale.yieldVal = ''; state.scale.haveVal = ''; render(); break;
    case 'add-ing': {
      var pa = parteDe(el); pa.ingredientes.push(novoIngForm()); f.dirty = true; render();
      focarUltimo(containerDaParte(pa), '[data-i="nome"]'); break;
    }
    case 'del-ing': {
      var pd = parteDe(el), idI = acima(el, 'data-ing').getAttribute('data-ing');
      pd.ingredientes = pd.ingredientes.filter(function(i){ return i.id !== idI; });
      if (!pd.ingredientes.length) pd.ingredientes.push(novoIngForm());
      f.dirty = true; render(); break;
    }
    case 'add-step': {
      var ps = parteDe(el); ps.passos.push(novoPassoForm()); f.dirty = true; render();
      focarUltimo(containerDaParte(ps), '[data-step]'); break;
    }
    case 'del-step': {
      var pp = parteDe(el), idS = acima(el, 'data-stepid').getAttribute('data-stepid');
      pp.passos = pp.passos.filter(function(s){ return s.id !== idS; });
      if (!pp.passos.length) pp.passos.push(novoPassoForm());
      f.dirty = true; render(); break;
    }
    case 'add-part': {
      var nova = novaParteForm('');
      f.partes.push(nova); f.dirty = true; render();
      /* ao dividir, o foco vai para o nome da 1ª parte, que já tem os ingredientes */
      var alvo = f.partes.length === 2 && !f.partes[0].nome ? f.partes[0] : nova;
      var inp = document.querySelector('#app [data-part="' + alvo.id + '"] [data-pname]');
      if (inp){ inp.focus(); if (inp.scrollIntoView) inp.scrollIntoView({ block: 'center' }); }
      break;
    }
    case 'part-up': case 'part-down': {
      var pm = parteDe(el), i0 = f.partes.indexOf(pm), i1 = i0 + (act === 'part-up' ? -1 : 1);
      if (i1 < 0 || i1 >= f.partes.length) break;
      f.partes[i0] = f.partes[i1]; f.partes[i1] = pm; f.dirty = true; render();
      var inp2 = document.querySelector('#app [data-part="' + pm.id + '"] [data-pname]');
      if (inp2 && inp2.scrollIntoView) inp2.scrollIntoView({ block: 'center' });
      break;
    }
    case 'del-part': {
      var px = parteDe(el), kx = f.partes.indexOf(px);
      var remover = function(){
        f.partes.splice(kx, 1);
        if (f.partes.length === 1) f.partes[0].nome = '';   /* voltou a ser receita de parte única */
        f.dirty = true; render();
      };
      if (parteTemConteudo(px)){
        confirmModal({ title: 'Remover "' + nomeParte(px, kx) + '"?', text: 'Os ingredientes e passos desta parte serão apagados. Para mantê-los, mova-os para outra parte antes.', ok: 'Remover', danger: true }, remover);
      } else remover();
      break;
    }
    case 'remove-photo': f.foto = null; f.dirty = true; render(); break;
    case 'save': salvarFormulario(); break;
    case 'cancel-edit': go('detail', { recipeId: f.id }, false); break;
    case 'export': exportarDownload(); break;
    case 'export-share': exportarCompartilhar(); break;
    case 'import-cancel': state.importPreview = null; render(); break;
    case 'import-merge': aplicarImport('merge'); break;
    case 'import-replace':
      confirmModal({ title: 'Substituir todas as receitas?', text: 'As ' + state.recipes.length + ' receitas atuais serão apagadas e trocadas pelas do arquivo. Considere baixar um backup antes.', ok: 'Substituir', danger: true },
        function(){ aplicarImport('replace'); });
      break;
  }
}

/* ---------- Inicialização ---------- */
document.getElementById('appLogo').innerHTML = ico('cup');
document.getElementById('footer').innerHTML = 'Conversor de Receitas · v' + APP_VERSION;
applyThemeUI();
var retornoDrive = driveRetorno();
if (retornoDrive) state.view = 'backup';
render();
/* recarregou estando na entrada de guarda? ela já existe — não empilhar outra */
try { if (history.state && history.state.guarda) guardaArmada = true; } catch(e){}
armarVoltar();
if (retornoDrive){
  if (retornoDrive.erro) toast(retornoDrive.erro, 'err');
  else if (retornoDrive.acao) driveExecutar(retornoDrive.acao, true);
}
function medirBarra(){ var t = document.querySelector('.tabs-wrap'); if (t) document.documentElement.style.setProperty('--nav-h', t.offsetHeight + 'px'); }
medirBarra(); window.addEventListener('resize', medirBarra);
try { if (!localStorage.getItem(STORE_KEY)) saveData(); } catch(e){}

if ('serviceWorker' in navigator && location.protocol !== 'file:'){
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
</script>
