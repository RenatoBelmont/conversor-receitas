<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F5EF">
<title>Conversor de Receitas</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F5EF;
    --surface:#FFFFFF;
    --surface-2:#ECEAE0;
    --surface-3:#E1DFD2;
    --border:#E4E1D3;
    --text:#1B1C17;
    --text-muted:#68695D;
    --primary:#39644F;
    --primary-container:#D7EBDD;
    --on-primary-container:#0C2A1B;
    --accent:#B5551F;
    --accent-container:#F7E1CE;
    --warn:#B3261E;
    --warn-container:#F9DEDC;
    --radius:20px;
    --radius-sm:12px;
    --shadow-1:0 1px 2px rgba(30,28,15,.06), 0 1px 6px rgba(30,28,15,.08);
    --shadow-2:0 4px 10px rgba(30,28,15,.16), 0 1px 4px rgba(30,28,15,.10);
    font-size:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    -webkit-tap-highlight-color:transparent;
    min-height:100vh;
    padding-bottom:86px;
  }
  h1,h2,h3,.serif{
    font-family:'Fraunces',Georgia,serif;
    font-weight:600;
    letter-spacing:-0.01em;
    margin:0;
  }
  button{-webkit-tap-highlight-color:transparent;}
  .app-bar{
    position:sticky; top:0; z-index:20;
    background:var(--bg);
    box-shadow:0 1px 0 rgba(30,28,15,.05);
    padding:20px 20px 16px;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .app-bar h1{font-size:1.55rem; color:var(--text);}
  .app-bar .sub{font-size:0.82rem; color:var(--text-muted); margin-top:3px;}
  .icon-btn{
    background:var(--surface); border:none; color:var(--primary);
    width:42px; height:42px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:1.1rem; cursor:pointer; box-shadow:var(--shadow-1);
  }
  main{padding:18px 20px 24px; max-width:640px; margin:0 auto;}
  .hidden{display:none !important;}

  /* Topic chips / grid */
  .topics-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:6px;}
  .topic-card{
    background:var(--surface); border:none; border-radius:var(--radius); box-shadow:var(--shadow-1);
    padding:18px; cursor:pointer; text-align:left; transition:box-shadow .15s, transform .15s;
  }
  .topic-card:active{box-shadow:var(--shadow-1); transform:scale(.98);}
  .topic-card .count{color:var(--accent); font-size:0.76rem; font-weight:700; text-transform:none;}
  .topic-card h3{font-size:1.05rem; margin-top:6px; color:var(--text);}
  .topic-card.all{background:var(--primary); color:#fff;}
  .topic-card.all .count{color:var(--primary-container);}
  .topic-card.all h3{color:#fff;}

  .section-label{
    color:var(--text-muted); font-size:0.78rem; font-weight:700;
    margin:28px 0 10px; display:flex; align-items:center; justify-content:space-between;
    text-transform:uppercase; letter-spacing:.03em;
  }
  .section-label button{background:none;border:none;color:var(--accent);font-size:0.78rem;font-weight:700;cursor:pointer;padding:0;text-transform:none;letter-spacing:0;}

  .search-box{
    display:flex; align-items:center; gap:10px; background:var(--surface);
    border:none; box-shadow:var(--shadow-1); border-radius:999px; padding:13px 18px; margin-top:4px;
  }
  .search-box input{
    flex:1; background:none; border:none; outline:none; color:var(--text); font-size:0.95rem; font-family:inherit;
  }
  .search-box input::placeholder{color:var(--text-muted);}

  /* Recipe list rows */
  .recipe-row{
    display:flex; align-items:center; gap:14px; background:var(--surface);
    border:none; box-shadow:var(--shadow-1); border-radius:var(--radius); padding:12px 14px; margin-bottom:10px; cursor:pointer;
    transition:transform .15s;
  }
  .recipe-row:active{transform:scale(.98);}
  .recipe-row .thumb{
    width:52px; height:52px; border-radius:var(--radius-sm); background:var(--primary-container);
    display:flex; align-items:center; justify-content:center; font-size:1.3rem; flex-shrink:0; overflow:hidden;
  }
  .recipe-row .thumb img{width:100%;height:100%;object-fit:cover;}
  .recipe-row .info{flex:1; min-width:0;}
  .recipe-row .info h4{font-family:'Fraunces',serif; font-weight:600; font-size:1rem; margin:0; color:var(--text);}
  .recipe-row .info .meta{font-size:0.78rem; color:var(--text-muted); margin-top:3px;}
  .empty-state{
    text-align:center; padding:40px 20px; color:var(--text-muted);
  }
  .empty-state .glyph{font-size:2rem; margin-bottom:10px;}
  .empty-state p{margin:4px 0; font-size:0.9rem;}

  /* Buttons — Material filled / tonal / outlined */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    background:var(--primary); color:#fff; border:none; border-radius:999px;
    padding:14px 24px; font-weight:600; font-size:0.95rem; cursor:pointer; font-family:inherit;
  }
  .btn.secondary{background:var(--primary-container); color:var(--on-primary-container); box-shadow:none;}
  .btn.ghost{background:none; color:var(--primary); padding:10px 6px;}
  .btn.block{width:100%;}
  .btn.danger{background:var(--warn-container); color:var(--warn);}

  /* Recipe detail */
  .back-link{display:flex; align-items:center; gap:6px; color:var(--text-muted); font-size:0.85rem; background:none; border:none; cursor:pointer; padding:0; margin-bottom:14px;}
  .recipe-photo{width:100%; aspect-ratio:16/9; object-fit:cover; border-radius:var(--radius); background:var(--surface-2); margin-bottom:16px;}
  .recipe-title{font-size:1.65rem; line-height:1.15;}
  .recipe-tags{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
  .tag{background:var(--surface-2); color:var(--text-muted); font-size:0.75rem; padding:5px 12px; border-radius:999px;}

  .scale-card{
    background:var(--surface); border:none; box-shadow:var(--shadow-1); border-radius:var(--radius);
    padding:18px; margin-top:22px;
  }
  .scale-tabs{display:flex; gap:4px; background:var(--surface-2); border-radius:999px; padding:4px; margin-bottom:16px;}
  .scale-tab{flex:1; text-align:center; padding:10px; border-radius:999px; font-size:0.85rem; font-weight:600; color:var(--text-muted); cursor:pointer; background:none; border:none; font-family:inherit; transition:background .15s,color .15s;}
  .scale-tab.active{background:var(--primary); color:#fff;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:0.78rem; color:var(--text-muted); margin-bottom:6px; font-weight:600;}
  .field select, .field input[type=text], .field input[type=number]{
    width:100%; background:var(--surface); border:1.5px solid var(--border); color:var(--text);
    padding:12px 13px; border-radius:var(--radius-sm); font-size:0.95rem; font-family:inherit; outline:none;
  }
  .field select:focus, .field input:focus{border-color:var(--primary);}
  .field .row2{display:flex; gap:10px;}
  .field .row2 > *{flex:1;}
  .factor-pill{
    display:inline-block; background:var(--primary-container); color:var(--on-primary-container); font-weight:700; font-size:0.82rem;
    padding:6px 14px; border-radius:999px; margin-top:2px;
  }
  .reset-scale{font-size:0.78rem; color:var(--accent); background:none; border:none; text-decoration:underline; cursor:pointer; margin-left:8px;}

  .ing-list{list-style:none; margin:16px 0 0; padding:0;}
  .ing-list li{
    display:flex; align-items:flex-start; gap:12px; padding:12px 0; border-bottom:1px solid var(--border);
  }
  .ing-list li:last-child{border-bottom:none;}
  .ing-check{
    width:22px; height:22px; border-radius:7px; border:2px solid var(--text-muted); flex-shrink:0; margin-top:1px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-size:0.75rem; color:#fff; transition:background .15s,border-color .15s;
  }
  .ing-check.checked{background:var(--primary); border-color:var(--primary);}
  .ing-main{flex:1;}
  .ing-main .qty{font-weight:700; color:var(--accent);}
  .ing-main.done-text{text-decoration:line-through; color:var(--text-muted);}
  .ing-note{font-size:0.76rem; color:var(--text-muted); margin-top:3px;}
  .ing-note.warn{color:var(--warn);}

  .steps-list{margin:14px 0 0; padding:0; list-style:none; counter-reset:step;}
  .steps-list li{counter-increment:step; padding:11px 0 11px 36px; position:relative; border-bottom:1px solid var(--border); font-size:0.92rem; line-height:1.55;}
  .steps-list li:last-child{border-bottom:none;}
  .steps-list li::before{
    content:counter(step); position:absolute; left:0; top:9px; width:25px; height:25px; border-radius:50%;
    background:var(--primary-container); color:var(--on-primary-container); font-weight:700; font-size:0.75rem;
    display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif;
  }

  .action-row{display:flex; gap:10px; margin-top:20px;}
  .action-row .btn{flex:1;}

  /* Form */
  .form-block{margin-bottom:24px;}
  .form-block h3{font-size:0.78rem; color:var(--text-muted); margin-bottom:12px; text-transform:uppercase; letter-spacing:.04em; font-family:'Inter',sans-serif; font-weight:700;}
  .ing-form-row{background:var(--surface); box-shadow:var(--shadow-1); border-radius:var(--radius-sm); padding:14px; margin-bottom:10px;}
  .ing-form-row .top-line{display:flex; gap:8px; margin-bottom:10px;}
  .ing-form-row .top-line input[type=text]{flex:2;}
  .ing-form-row .top-line input[type=number]{flex:1;}
  .ing-form-row .top-line select{flex:1;}
  .ing-form-row .sub-line{display:flex; align-items:center; gap:10px; font-size:0.78rem; color:var(--text-muted); flex-wrap:wrap;}
  .ing-form-row .sub-line input[type=number]{width:80px; background:var(--surface-2); border:1.5px solid var(--border); color:var(--text); border-radius:8px; padding:7px 9px;}
  .remove-ing{background:none; border:none; color:var(--warn); font-size:0.78rem; cursor:pointer; margin-left:auto; font-weight:600;}
  .step-form-row{display:flex; gap:8px; margin-bottom:8px; align-items:flex-start;}
  .step-form-row textarea{
    flex:1; background:var(--surface); box-shadow:var(--shadow-1); border:none; color:var(--text); border-radius:var(--radius-sm);
    padding:12px 13px; font-family:inherit; font-size:0.9rem; resize:vertical; min-height:46px; outline:none;
  }
  .add-row-btn{background:var(--primary-container); border:none; color:var(--on-primary-container); border-radius:var(--radius-sm); padding:12px; width:100%; font-size:0.85rem; font-weight:600; cursor:pointer; font-family:inherit;}
  .photo-picker{
    border:1.5px dashed var(--border); border-radius:var(--radius); padding:22px; text-align:center; color:var(--text-muted);
    cursor:pointer; font-size:0.85rem; background:var(--surface); position:relative; overflow:hidden;
  }
  .photo-picker img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
  .photo-picker input{position:absolute; inset:0; opacity:0; cursor:pointer;}

  /* FAB */
  .fab{
    position:fixed; right:20px; bottom:calc(84px + env(safe-area-inset-bottom));
    width:58px; height:58px; border-radius:18px; background:var(--primary); color:#fff; border:none;
    box-shadow:var(--shadow-2); font-size:1.6rem; display:flex; align-items:center; justify-content:center;
    cursor:pointer; z-index:31; line-height:1;
  }

  /* Bottom nav */
  .bottom-nav{
    position:fixed; bottom:0; left:0; right:0; z-index:30;
    background:var(--surface); box-shadow:0 -1px 8px rgba(30,28,15,.08);
    display:flex; padding:10px 24px calc(8px + env(safe-area-inset-bottom));
  }
  .nav-btn{
    flex:1; background:none; border:none; color:var(--text-muted); font-family:inherit;
    display:flex; flex-direction:column; align-items:center; gap:4px; font-size:0.7rem; padding:4px; cursor:pointer; font-weight:600;
  }
  .nav-btn .g{font-size:1.2rem; width:52px; height:30px; display:flex; align-items:center; justify-content:center; border-radius:16px; transition:background .15s;}
  .nav-btn.active{color:var(--text);}
  .nav-btn.active .g{background:var(--primary-container); color:var(--on-primary-container);}

  .toast{
    position:fixed; bottom:88px; left:50%; transform:translateX(-50%); background:var(--text); color:var(--bg);
    padding:11px 20px; border-radius:999px; font-size:0.85rem; font-weight:600; z-index:50; opacity:0; pointer-events:none;
    transition:opacity .2s; box-shadow:var(--shadow-2);
  }
  .toast.show{opacity:1;}

  @media (min-width:640px){ .topics-grid{grid-template-columns:1fr 1fr 1fr;} }
</style>
</head>
<body>

<div class="app-bar">
  <div>
    <h1 id="barTitle">Receitas</h1>
    <div class="sub" id="barSub">Suas receitas, na medida certa</div>
  </div>
  <button class="icon-btn hidden" id="editBtn" title="Editar">✎</button>
</div>

<main id="app"></main>

<button class="fab" id="fabAdd" title="Nova receita">＋</button>

<div class="bottom-nav">
  <button class="nav-btn active" data-view="home"><span class="g">⌂</span>Início</button>
  <button class="nav-btn" data-view="search"><span class="g">⌕</span>Buscar</button>
</div>

<div class="toast" id="toast"></div>

<script>
/* ---------- Dados & armazenamento ---------- */
const STORE_KEY = 'receitas_app_v1';

const PESO_PADRAO = [
  ['clara de ovo', 30], ['clara', 30], ['claras', 30],
  ['gema de ovo', 18], ['gema', 18], ['gemas', 18],
  ['ovo', 50], ['ovos', 50], ['ovo inteiro', 50],
  ['dente de alho', 5], ['dentes de alho', 5],
  ['fatia de bacon', 20],
];

function sugerirPeso(nome){
  const n = (nome||'').toLowerCase();
  for (const [chave, peso] of PESO_PADRAO){ if (n.includes(chave)) return peso; }
  return null;
}

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function loadData(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return JSON.parse(raw);
  }catch(e){}
  return seed();
}
function saveData(){ localStorage.setItem(STORE_KEY, JSON.stringify(state.recipes)); }

function seed(){
  return [{
    id: uid(),
    nome: 'Suspiro de Merengue',
    topico: 'Sobremesas',
    foto: null,
    rendimentoQtd: 20,
    rendimentoUnidade: 'suspiros',
    ingredientes: [
      { id: uid(), nome: 'Claras de ovo', qtd: 4, unidade: 'un', contavel: true, pesoUnitario: 30 },
      { id: uid(), nome: 'Açúcar refinado', qtd: 200, unidade: 'g', contavel: false, pesoUnitario: null },
      { id: uid(), nome: 'Açúcar de confeiteiro', qtd: 50, unidade: 'g', contavel: false, pesoUnitario: null },
      { id: uid(), nome: 'Suco de limão', qtd: 0.5, unidade: 'colher de chá', contavel: false, pesoUnitario: null },
      { id: uid(), nome: 'Sal', qtd: 1, unidade: 'pitada', contavel: true, pesoUnitario: null },
    ],
    passos: [
      'Bata as claras em ponto de neve com o sal e o suco de limão.',
      'Adicione o açúcar refinado aos poucos, batendo sempre, até obter picos firmes e brilhantes.',
      'Incorpore o açúcar de confeiteiro delicadamente com uma espátula.',
      'Modele os suspiros numa assadeira forrada e asse a 100°C por cerca de 1h30, até secarem por completo.'
    ],
    createdAt: Date.now()
  }];
}

let state = {
  recipes: loadData(),
  view: 'home',
  currentTopic: null,
  currentRecipeId: null,
  editingId: null,
  scaleMode: 'rendimento',   // 'rendimento' | 'ingrediente'
  scaleFactor: 1,
  checklist: {},
  formIngredients: [],
  formSteps: [],
  formPhoto: null,
};

/* ---------- Utilitários de arredondamento ---------- */
function arredondarContinuo(qtd, unidade){
  const u = (unidade||'').toLowerCase();
  if (u === 'g' || u === 'ml'){
    if (qtd < 10) return Math.round(qtd*10)/10;
    if (qtd < 200) return Math.round(qtd);
    return Math.round(qtd/5)*5;
  }
  if (u === 'kg' || u === 'l'){
    return Math.round(qtd*100)/100;
  }
  if (u === 'colher de sopa' || u === 'colher de chá' || u === 'xícara' || u === 'xicara'){
    return arredondarFracao(qtd, 4); // aproxima para 1/4
  }
  return Math.round(qtd*100)/100;
}
function arredondarFracao(qtd, denom){
  return Math.round(qtd*denom)/denom;
}
function paraFracaoTexto(valor){
  if (Math.abs(valor - Math.round(valor)) < 0.001) return String(Math.round(valor));
  const inteiro = Math.floor(valor);
  const resto = valor - inteiro;
  const fracoes = [[0.25,'1/4'],[0.333,'1/3'],[0.5,'1/2'],[0.667,'2/3'],[0.75,'3/4']];
  let melhor = fracoes[0], dist = Infinity;
  for (const f of fracoes){ const d = Math.abs(resto-f[0]); if (d<dist){dist=d; melhor=f;} }
  if (inteiro === 0) return melhor[1];
  return inteiro + ' ' + melhor[1];
}
function ehUnidadeFracionavel(unidade){
  const u = (unidade||'').toLowerCase();
  return u.includes('colher') || u.includes('xíc') || u.includes('xic');
}

// Retorna { valorFinal, textoQtd, nota, alerta }
function calcularIngredienteEscalado(ing, fator){
  const bruto = ing.qtd * fator;
  if (ing.contavel){
    const arred = Math.max(1, Math.round(bruto));
    const diff = Math.abs(arred - bruto);
    let nota = null, alerta = false;
    if (diff > 0.15){
      alerta = true;
      if (ing.pesoUnitario){
        const gramas = Math.round(bruto * ing.pesoUnitario);
        nota = `≈ ${gramas} g no total (cada ${ing.unidade === 'un' ? 'unidade' : ing.unidade} ~${ing.pesoUnitario} g) — pese para maior precisão`;
      } else {
        nota = `arredondado de ${bruto.toFixed(1)} — informe o peso de 1 unidade para ajuste exato`;
      }
    }
    return { textoQtd: `${arred} ${ing.unidade}`, nota, alerta };
  }
  if (ehUnidadeFracionavel(ing.unidade)){
    const arred = arredondarFracao(bruto, 4);
    const diff = Math.abs(arred - bruto);
    const texto = `${paraFracaoTexto(arred)} ${ing.unidade}`;
    return { textoQtd: texto, nota: diff > 0.05 ? `valor exato: ${bruto.toFixed(2)}` : null, alerta:false };
  }
  const arred = arredondarContinuo(bruto, ing.unidade);
  const diff = Math.abs(arred - bruto);
  return {
    textoQtd: `${arred} ${ing.unidade}`,
    nota: diff > Math.max(0.3, bruto*0.02) ? `valor exato: ${bruto.toFixed(2)} ${ing.unidade}` : null,
    alerta: false
  };
}

/* ---------- Navegação ---------- */
function ir(view, params){
  state.view = view;
  if (params) Object.assign(state, params);
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active', b.dataset.view===view || (view==='detail'&&b.dataset.view==='home') || (view==='topic'&&b.dataset.view==='home')));
  document.getElementById('editBtn').classList.add('hidden');
  render();
  window.scrollTo(0,0);
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}

/* ---------- Render principal ---------- */
function render(){
  const app = document.getElementById('app');
  const barTitle = document.getElementById('barTitle');
  const barSub = document.getElementById('barSub');
  if (state.view === 'home'){
    barTitle.textContent = 'Receitas';
    barSub.textContent = 'Suas receitas, na medida certa';
    app.innerHTML = renderHome();
  } else if (state.view === 'topic'){
    barTitle.textContent = state.currentTopic;
    barSub.textContent = 'Tópico';
    app.innerHTML = renderTopic();
  } else if (state.view === 'search'){
    barTitle.textContent = 'Buscar';
    barSub.textContent = 'Por nome, tópico ou ingrediente';
    app.innerHTML = renderSearch();
  } else if (state.view === 'detail'){
    const r = getRecipe(state.currentRecipeId);
    barTitle.textContent = '';
    barSub.textContent = '';
    document.getElementById('editBtn').classList.remove('hidden');
    app.innerHTML = renderDetail(r);
  } else if (state.view === 'form'){
    barTitle.textContent = state.editingId ? 'Editar receita' : 'Nova receita';
    barSub.textContent = 'Preencha os dados abaixo';
    app.innerHTML = renderForm();
  }
  const fab = document.getElementById('fabAdd');
  if (fab) fab.style.display = (state.view === 'form') ? 'none' : 'flex';
  attachHandlers();
}

function getRecipe(id){ return state.recipes.find(r=>r.id===id); }
function topicos(){
  const m = {};
  state.recipes.forEach(r=>{ m[r.topico] = (m[r.topico]||0)+1; });
  return Object.entries(m).sort((a,b)=>a[0].localeCompare(b[0]));
}

/* ---------- HOME ---------- */
function renderHome(){
  const ts = topicos();
  if (state.recipes.length === 0){
    return `<div class="empty-state">
      <div class="glyph">🥣</div>
      <h3 class="serif">Nenhuma receita ainda</h3>
      <p>Toque em "Nova receita" para adicionar a primeira.</p>
      <div style="margin-top:16px;"><button class="btn" data-nav="form">Adicionar receita</button></div>
    </div>`;
  }
  let html = `<div class="topics-grid">`;
  html += `<button class="topic-card all" data-nav="topic" data-topic="__all__">
      <div class="count">${state.recipes.length} receita${state.recipes.length===1?'':'s'}</div>
      <h3>Todas</h3>
    </button>`;
  ts.forEach(([nome,count])=>{
    html += `<button class="topic-card" data-nav="topic" data-topic="${escAttr(nome)}">
      <div class="count">${count} receita${count===1?'':'s'}</div>
      <h3>${esc(nome)}</h3>
    </button>`;
  });
  html += `</div>`;
  html += `<div class="section-label">Recentes</div>`;
  const recentes = [...state.recipes].sort((a,b)=>b.createdAt-a.createdAt).slice(0,5);
  html += `<div>${recentes.map(rowHtml).join('')}</div>`;
  return html;
}

function rowHtml(r){
  const totalIng = r.ingredientes.length;
  return `<div class="recipe-row" data-nav="detail" data-id="${r.id}">
    <div class="thumb">${r.foto ? `<img src="${r.foto}">` : '🍽️'}</div>
    <div class="info">
      <h4>${esc(r.nome)}</h4>
      <div class="meta">${esc(r.topico)} · ${totalIng} ingrediente${totalIng===1?'':'s'} · rende ${r.rendimentoQtd} ${esc(r.rendimentoUnidade)}</div>
    </div>
  </div>`;
}

/* ---------- TÓPICO ---------- */
function renderTopic(){
  const lista = state.currentTopic === '__all__'
    ? state.recipes
    : state.recipes.filter(r=>r.topico===state.currentTopic);
  let html = `<button class="back-link" data-nav="home">‹ Início</button>`;
  if (lista.length === 0){
    html += `<div class="empty-state"><p>Nenhuma receita neste tópico.</p></div>`;
  } else {
    html += `<div>${lista.map(rowHtml).join('')}</div>`;
  }
  return html;
}

/* ---------- BUSCA ---------- */
function renderSearch(q){
  q = (state.searchQuery||'').toLowerCase().trim();
  const resultados = q ? state.recipes.filter(r=>{
    if (r.nome.toLowerCase().includes(q) || r.topico.toLowerCase().includes(q)) return true;
    return r.ingredientes.some(i=>i.nome.toLowerCase().includes(q));
  }) : [];
  let html = `<div class="search-box"><span>⌕</span><input type="text" id="searchInput" placeholder="Nome, tópico ou ingrediente..." value="${escAttr(state.searchQuery||'')}"></div>`;
  if (q && resultados.length === 0){
    html += `<div class="empty-state"><p>Nada encontrado para "${esc(q)}".</p></div>`;
  } else if (resultados.length){
    html += `<div style="margin-top:16px;">${resultados.map(rowHtml).join('')}</div>`;
  } else {
    html += `<div class="empty-state"><p>Digite para buscar em suas receitas.</p></div>`;
  }
  return html;
}

/* ---------- DETALHE + ESCALA ---------- */
function renderDetail(r){
  if (!r) return `<div class="empty-state"><p>Receita não encontrada.</p></div>`;
  const fator = state.scaleFactor || 1;
  const fatorTxt = fator.toFixed(2).replace(/\.00$/,'').replace(/0$/,m=>m).replace(/(\.\d)0$/,'$1');

  let optsIng = r.ingredientes.map(i=>`<option value="${i.id}" ${state.refIngId===i.id?'selected':''}>${esc(i.nome)} (original: ${i.qtd} ${esc(i.unidade)})</option>`).join('');

  const ingHtml = r.ingredientes.map(ing=>{
    const calc = calcularIngredienteEscalado(ing, fator);
    const checked = !!state.checklist[ing.id];
    return `<li>
      <div class="ing-check ${checked?'checked':''}" data-check="${ing.id}">${checked?'✓':''}</div>
      <div style="flex:1;">
        <div class="ing-main ${checked?'done-text':''}"><span class="qty">${calc.textoQtd}</span> — ${esc(ing.nome)}</div>
        ${calc.nota ? `<div class="ing-note ${calc.alerta?'warn':''}">${esc(calc.nota)}</div>` : ''}
      </div>
    </li>`;
  }).join('');

  return `
    <button class="back-link" data-nav="home">‹ Início</button>
    ${r.foto ? `<img class="recipe-photo" src="${r.foto}">` : ''}
    <h2 class="recipe-title">${esc(r.nome)}</h2>
    <div class="recipe-tags">
      <span class="tag">${esc(r.topico)}</span>
      <span class="tag">rende ${r.rendimentoQtd} ${esc(r.rendimentoUnidade)}</span>
    </div>

    <div class="scale-card">
      <div class="scale-tabs">
        <button class="scale-tab ${state.scaleMode==='rendimento'?'active':''}" data-scalemode="rendimento">Por rendimento</button>
        <button class="scale-tab ${state.scaleMode==='ingrediente'?'active':''}" data-scalemode="ingrediente">Por ingrediente</button>
      </div>

      ${state.scaleMode==='rendimento' ? `
        <div class="field">
          <label>Quantas ${esc(r.rendimentoUnidade)} você quer fazer?</label>
          <input type="number" inputmode="decimal" id="yieldInput" value="${state.yieldInput ?? r.rendimentoQtd}" min="0" step="any">
        </div>
      ` : `
        <div class="field">
          <label>Ingrediente que você tem em quantidade diferente</label>
          <select id="refIngSelect">${optsIng}</select>
        </div>
        <div class="field">
          <label>Quanto você tem desse ingrediente (na mesma unidade)</label>
          <input type="number" inputmode="decimal" id="haveInput" value="${state.haveInput ?? ''}" min="0" step="any" placeholder="ex: 3">
        </div>
      `}
      <div>
        <span class="factor-pill">Fator: ${fatorTxt}×</span>
        ${fator!==1 ? '<button class="reset-scale" data-reset-scale="1">usar receita original</button>' : ''}
      </div>
    </div>

    <div class="section-label">Ingredientes ${fator!==1 ? '(recalculados)' : ''}</div>
    <ul class="ing-list">${ingHtml}</ul>

    ${r.passos && r.passos.length ? `
      <div class="section-label">Modo de preparo</div>
      <ol class="steps-list">${r.passos.map(p=>`<li>${esc(p)}</li>`).join('')}</ol>
    ` : ''}

    <div class="action-row">
      <button class="btn secondary" id="shareBtn">Compartilhar</button>
      <button class="btn danger" id="deleteBtn">Excluir</button>
    </div>
  `;
}

/* ---------- FORMULÁRIO ---------- */
function novoIngredienteForm(){
  return { id: uid(), nome:'', qtd:'', unidade:'g', contavel:false, pesoUnitario:'' };
}

function renderForm(){
  const editing = state.editingId ? getRecipe(state.editingId) : null;
  if (editing && !state.formLoaded){
    state.formIngredients = editing.ingredientes.map(i=>({...i}));
    state.formSteps = [...editing.passos];
    state.formPhoto = editing.foto;
    state.formLoaded = true;
  } else if (!editing && !state.formLoaded){
    state.formIngredients = [novoIngredienteForm()];
    state.formSteps = [''];
    state.formPhoto = null;
    state.formLoaded = true;
  }

  const ingHtml = state.formIngredients.map((ing,idx)=>`
    <div class="ing-form-row" data-ingrow="${ing.id}">
      <div class="top-line">
        <input type="text" placeholder="Ingrediente" value="${escAttr(ing.nome)}" data-fld="nome" data-id="${ing.id}">
        <input type="number" placeholder="Qtd" value="${ing.qtd}" step="any" data-fld="qtd" data-id="${ing.id}">
        <select data-fld="unidade" data-id="${ing.id}">
          ${['g','kg','ml','l','un','colher de sopa','colher de chá','xícara','pitada','a gosto'].map(u=>`<option value="${u}" ${ing.unidade===u?'selected':''}>${u}</option>`).join('')}
        </select>
      </div>
      <div class="sub-line">
        <label style="display:flex;align-items:center;gap:5px;"><input type="checkbox" data-fld="contavel" data-id="${ing.id}" ${ing.contavel?'checked':''}> item contável (não fraciona)</label>
        ${ing.contavel ? `<span>peso de 1 un.: <input type="number" placeholder="g" value="${ing.pesoUnitario||''}" data-fld="pesoUnitario" data-id="${ing.id}"></span>` : ''}
        <button class="remove-ing" data-removeing="${ing.id}">remover</button>
      </div>
    </div>
  `).join('');

  const stepsHtml = state.formSteps.map((s,idx)=>`
    <div class="step-form-row">
      <textarea placeholder="Passo ${idx+1}" data-stepidx="${idx}">${esc(s)}</textarea>
      <button class="remove-ing" data-removestep="${idx}">✕</button>
    </div>
  `).join('');

  return `
    <div class="form-block">
      <label class="photo-picker" style="display:block;">
        ${state.formPhoto ? `<img src="${state.formPhoto}">` : ''}
        <span style="position:relative;">📷 Adicionar foto (opcional)</span>
        <input type="file" accept="image/*" id="photoInput">
      </label>
    </div>

    <div class="form-block">
      <h3>Dados básicos</h3>
      <div class="field"><label>Nome da receita</label><input type="text" id="fNome" value="${escAttr(editing?editing.nome:'')}" placeholder="ex: Suspiro de merengue"></div>
      <div class="field"><label>Tópico / categoria</label><input type="text" id="fTopico" value="${escAttr(editing?editing.topico:'')}" placeholder="ex: Sobremesas" list="topicList">
        <datalist id="topicList">${topicos().map(t=>`<option value="${escAttr(t[0])}">`).join('')}</datalist>
      </div>
      <div class="field row2">
        <div><label>Rendimento (quantidade)</label><input type="number" id="fRendQtd" value="${editing?editing.rendimentoQtd:''}" step="any"></div>
        <div><label>Unidade do rendimento</label><input type="text" id="fRendUnid" value="${escAttr(editing?editing.rendimentoUnidade:'')}" placeholder="ex: suspiros, porções, fatias"></div>
      </div>
    </div>

    <div class="form-block">
      <h3>Ingredientes</h3>
      <div id="ingContainer">${ingHtml}</div>
      <button class="add-row-btn" id="addIngBtn">+ adicionar ingrediente</button>
    </div>

    <div class="form-block">
      <h3>Modo de preparo</h3>
      <div id="stepsContainer">${stepsHtml}</div>
      <button class="add-row-btn" id="addStepBtn">+ adicionar passo</button>
    </div>

    <button class="btn block" id="saveBtn">${editing ? 'Salvar alterações' : 'Salvar receita'}</button>
    ${editing ? `<button class="btn ghost block" id="cancelEditBtn" style="margin-top:8px;">Cancelar</button>` : ''}
  `;
}

/* ---------- Handlers ---------- */
function attachHandlers(){
  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.onclick = ()=>{
      const view = el.dataset.nav;
      if (view==='topic') ir('topic', {currentTopic: el.dataset.topic});
      else if (view==='detail') ir('detail', {currentRecipeId: el.dataset.id, scaleFactor:1, scaleMode:'rendimento', yieldInput:null, haveInput:null, checklist:{}});
      else if (view==='form') ir('form', {editingId:null, formLoaded:false});
      else ir(view);
    };
  });

  if (state.view==='search'){
    const inp = document.getElementById('searchInput');
    if (inp){ inp.oninput = (e)=>{ state.searchQuery = e.target.value; render(); setTimeout(()=>{ const i2=document.getElementById('searchInput'); if(i2){ i2.focus(); i2.selectionStart=i2.selectionEnd=i2.value.length; } },0); }; }
  }

  if (state.view==='detail'){
    document.getElementById('editBtn').onclick = ()=> ir('form', {editingId: state.currentRecipeId, formLoaded:false});
    document.querySelectorAll('[data-scalemode]').forEach(b=>{
      b.onclick = ()=>{ state.scaleMode = b.dataset.scalemode; recalcFactor(); render(); };
    });
    const yieldInput = document.getElementById('yieldInput');
    if (yieldInput) yieldInput.oninput = (e)=>{ state.yieldInput = e.target.value; recalcFactor(); rerenderScaleOnly(); };
    const refSel = document.getElementById('refIngSelect');
    if (refSel) refSel.onchange = (e)=>{ state.refIngId = e.target.value; recalcFactor(); rerenderScaleOnly(); };
    const haveInput = document.getElementById('haveInput');
    if (haveInput) haveInput.oninput = (e)=>{ state.haveInput = e.target.value; recalcFactor(); rerenderScaleOnly(); };
    const resetBtn = document.querySelector('[data-reset-scale]');
    if (resetBtn) resetBtn.onclick = ()=>{ state.scaleFactor=1; state.yieldInput=null; state.haveInput=null; render(); };
    document.querySelectorAll('[data-check]').forEach(c=>{
      c.onclick = ()=>{ const id=c.dataset.check; state.checklist[id] = !state.checklist[id]; render(); };
    });
    const shareBtn = document.getElementById('shareBtn');
    if (shareBtn) shareBtn.onclick = ()=> compartilharReceita(getRecipe(state.currentRecipeId));
    const delBtn = document.getElementById('deleteBtn');
    if (delBtn) delBtn.onclick = ()=>{
      if (confirm('Excluir esta receita? Essa ação não pode ser desfeita.')){
        state.recipes = state.recipes.filter(r=>r.id!==state.currentRecipeId);
        saveData(); ir('home'); toast('Receita excluída');
      }
    };
  }

  if (state.view==='form'){
    document.getElementById('addIngBtn').onclick = ()=>{ state.formIngredients.push(novoIngredienteForm()); render(); };
    document.querySelectorAll('[data-removeing]').forEach(b=>{
      b.onclick = ()=>{ state.formIngredients = state.formIngredients.filter(i=>i.id!==b.dataset.removeing); render(); };
    });
    document.querySelectorAll('[data-fld]').forEach(el=>{
      el.oninput = el.onchange = (e)=>{
        const id = el.dataset.id, fld = el.dataset.fld;
        const ing = state.formIngredients.find(i=>i.id===id);
        if (!ing) return;
        if (fld==='contavel'){ ing.contavel = el.checked; if(ing.contavel && !ing.pesoUnitario){ const sug=sugerirPeso(ing.nome); if(sug) ing.pesoUnitario=sug; } render(); return; }
        ing[fld] = el.value;
        if (fld==='nome' && ing.contavel && !ing.pesoUnitario){ const sug = sugerirPeso(el.value); if (sug) ing.pesoUnitario = sug; }
      };
    });
    document.getElementById('addStepBtn').onclick = ()=>{ state.formSteps.push(''); render(); };
    document.querySelectorAll('[data-stepidx]').forEach(el=>{
      el.oninput = (e)=>{ state.formSteps[parseInt(el.dataset.stepidx)] = el.value; };
    });
    document.querySelectorAll('[data-removestep]').forEach(b=>{
      b.onclick = ()=>{ state.formSteps.splice(parseInt(b.dataset.removestep),1); render(); };
    });
    const photoInput = document.getElementById('photoInput');
    if (photoInput) photoInput.onchange = (e)=>{
      const file = e.target.files[0]; if(!file) return;
      const reader = new FileReader();
      reader.onload = ()=>{ state.formPhoto = reader.result; render(); };
      reader.readAsDataURL(file);
    };
    document.getElementById('saveBtn').onclick = salvarReceita;
    const cancelBtn = document.getElementById('cancelEditBtn');
    if (cancelBtn) cancelBtn.onclick = ()=> ir('detail', {currentRecipeId: state.editingId});
  }
}

function recalcFactor(){
  const r = getRecipe(state.currentRecipeId);
  if (!r) return;
  if (state.scaleMode === 'rendimento'){
    const v = parseFloat(state.yieldInput);
    state.scaleFactor = (isFinite(v) && v>0 && r.rendimentoQtd>0) ? v / r.rendimentoQtd : 1;
  } else {
    const refId = state.refIngId || (r.ingredientes[0] && r.ingredientes[0].id);
    const ing = r.ingredientes.find(i=>i.id===refId);
    const v = parseFloat(state.haveInput);
    state.scaleFactor = (ing && isFinite(v) && v>0 && ing.qtd>0) ? v / ing.qtd : 1;
  }
}

function rerenderScaleOnly(){ render(); }

function salvarReceita(){
  const nome = document.getElementById('fNome').value.trim();
  const topico = document.getElementById('fTopico').value.trim() || 'Sem categoria';
  const rendQtd = parseFloat(document.getElementById('fRendQtd').value) || 1;
  const rendUnid = document.getElementById('fRendUnid').value.trim() || 'porções';

  if (!nome){ toast('Dê um nome para a receita'); return; }

  const ingredientes = state.formIngredients
    .filter(i=>i.nome && i.nome.trim())
    .map(i=>({
      id:i.id, nome:i.nome.trim(),
      qtd: parseFloat(i.qtd)||0,
      unidade: i.unidade||'g',
      contavel: !!i.contavel,
      pesoUnitario: i.contavel && i.pesoUnitario ? parseFloat(i.pesoUnitario) : null
    }));
  if (ingredientes.length===0){ toast('Adicione ao menos um ingrediente'); return; }

  const passos = state.formSteps.map(s=>s.trim()).filter(Boolean);

  if (state.editingId){
    const r = getRecipe(state.editingId);
    Object.assign(r, {nome, topico, rendimentoQtd:rendQtd, rendimentoUnidade:rendUnid, ingredientes, passos, foto:state.formPhoto});
    saveData();
    toast('Receita atualizada');
    ir('detail', {currentRecipeId:r.id, scaleFactor:1});
  } else {
    const r = { id:uid(), nome, topico, rendimentoQtd:rendQtd, rendimentoUnidade:rendUnid, ingredientes, passos, foto:state.formPhoto, createdAt:Date.now() };
    state.recipes.push(r);
    saveData();
    toast('Receita salva');
    ir('detail', {currentRecipeId:r.id, scaleFactor:1});
  }
  state.formLoaded = false;
}

function compartilharReceita(r){
  const fator = state.scaleFactor||1;
  let txt = `${r.nome}\n(${fator!==1? 'ajustada '+fator.toFixed(2)+'x — ' : ''}rende ${r.rendimentoQtd} ${r.rendimentoUnidade})\n\nIngredientes:\n`;
  r.ingredientes.forEach(ing=>{
    const calc = calcularIngredienteEscalado(ing, fator);
    txt += `- ${calc.textoQtd} ${ing.nome}\n`;
  });
  if (r.passos.length){
    txt += `\nModo de preparo:\n`;
    r.passos.forEach((p,i)=> txt += `${i+1}. ${p}\n`);
  }
  if (navigator.share){
    navigator.share({title:r.nome, text:txt}).catch(()=>{});
  } else {
    navigator.clipboard.writeText(txt).then(()=>toast('Receita copiada!'));
  }
}

/* ---------- Helpers de escape ---------- */
function esc(s){ return String(s??'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function escAttr(s){ return esc(s); }

/* ---------- Nav inferior + FAB ---------- */
document.querySelectorAll('.nav-btn').forEach(btn=>{
  btn.onclick = ()=> ir(btn.dataset.view);
});
document.getElementById('fabAdd').onclick = ()=> ir('form', {editingId:null, formLoaded:false});

/* ---------- Inicialização ---------- */
render();

if ('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
